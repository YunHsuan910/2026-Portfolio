<!-- [電梯步驟1] 電梯CSS END -->
<style>
  body {
    /* 自行修正背景顏色 */
    background: url(bg-m.jpg) #111012 center 0 no-repeat;
    background-size: 100% auto;
    background-attachment: fixed;
  }

  @media screen and (min-width: 960px) {
    body {
      background: url(bg.jpg) #111012 center 0 no-repeat;
      background-size: 2560px auto;
      background-attachment: fixed;
    }
  }

  /* 調整logo位置大小 */
  .logo {
    top: 1%;
    left: 1%;
    width: 25%;
    max-width: 220px;
  }

  /* 連結測試 */
  /* .sp__visual a{
    filter: brightness(500%);
  } */

  /* 切片測試 */
  /* .visual__fragment::before {
    content: '';
    position: absolute;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 1px solid #00f;
    pointer-events: none;
  } */

  /*-- 動畫小物件 --*/
  /* ======================================== */
  .animate__wrap {
    position: relative;
    z-index: 1;
  }

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 6.5vw;
    left: 13vw;
    width: 78%;
    animation-delay: 1s;
  }
  .animate__wrap .animate__obj--02 {
    position: fixed;
    top: 40vw;
    left: -14vw;
    width: 24%;
    animation-duration: 1s;
    animation-iteration-count: 2;
  }
  .animate__wrap .animate__obj--03 {
    position: fixed;
    top: 40vw;
    left: -14vw;
    width: 24%;
    animation-duration: 7s;
  }
  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 38px;
      left: calc(50% - 326px);
      width: 770px;
    }
    .animate__wrap .animate__obj--02 {
      top: 386px;
      left: calc(50% - 603px);
      width: auto;
    }
    .animate__wrap .animate__obj--03 {
      top: 46px;
      left: calc(50% - 843px);
      width: auto;
    }
  }

</style>
