  <style>
    body {
      background-color: #430000;
    }

    body:before {
      background: url(bg-m.jpg) center 0 no-repeat;
      background-size: 100%;
    }

    @media screen and (min-width: 960px) {
      body:before {
        background: url(bg.jpg) center 0 no-repeat;
        background-size: auto;
      }
    }

    /* 調整logo位置大小 */
    .logo {
        top: 1%;
        left: 1%;
        width: 30%;
        max-width: 220px;
      }

    /* --- 動畫小物件 --- */
    .animate__wrap {
      z-index: 1;
    }

    /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    .animate__wrap .animate__obj--01 {
      position: absolute;
      z-index: -1;
      top: 3.2vw;
      left: 3.3vw;
      width: 93%;
    }
    .animate__wrap .animate__obj--02 {
      position: absolute;
      z-index: -1;
      top: 12.8vw;
      left: 8vw;
      width: 29%;
    }
  
    /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    @media screen and (min-width: 960px) {
      .animate__wrap .animate__obj--01 {
        top: 30px;
        left: calc(50% - 448px);
        width: auto;
      }
      .animate__wrap .animate__obj--02 {
        top: 122px;
        left: calc(50% - 409px);
        width: auto;
      }
    }

    /* --- 動畫小物件 end --- */

    /* --- 小網下電梯換色 start--- */
    @media screen and (max-width: 1213px){
      .footer__box .footer__ul {

      .footer__box li p{

        /* color: #fff; */
      }
    }

    @media screen and (min-width: 1213px){
      .sp-right__nav a{

        /* color: #000; */
      }
      .sp-right__nav li a.active, .sp-right__nav a:hover{
        /* 大網右電梯文字hover顏色 */
        /* color: #d10001; */
      }
      .sp-right__nav li a.active:after, .sp-right__nav a:hover:after{
        /* 大網右電梯TITLE圈圈的hover顏色 */

        /* border: 3px solid #d10001; */
      }
    }
    /* --- 電梯換色 end--- */

  </style>
