<html lang="zh-Hant-TW">

<head>

<!-- ============== 輪播css ============== -->

<!-- ============== 共用css ============== -->

  <!-- [電梯步驟1] 電梯CSS 不用就關掉 -->

  <!-- 商品右電梯CSS，步驟2有測試div可以測試 -->
  <!-- <link id="localElevatorRight" rel="stylesheet" href="sp-elevator-right.css"> -->

  <!-- 背景特效區塊的css -->
  <!-- <link rel="stylesheet" href="./style.css"> -->

  <style>

    body {
      position: relative;
    /* 背景顏色 */
      background-color: #e3cba4;
    }

    body:before {
      content: '';
      position: absolute;
      z-index: -1;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url(bg-m.jpg) center 0 no-repeat;
      background-size: 100%;
    }

    @media screen and (min-width:960px) {
      body:before {
        background: url(bg.jpg) center 0 no-repeat;
        background-size: auto;
      }
    }

    body.bg-fixed:before {
      position: fixed;
      height: 100vh;
    }

    /* 調整logo位置大小 */
    /* .logo {
      top: 1%;
      left: 1%;
      width: 30%;
      max-width: 220px;
    } */

      /* 連結測試 */
      /* .sp__visual a{
        filter: brightness(500%);
      } */

      /* 切片測試 */
      /* .visual__fragment::before {
        content: '';
        position: absolute;
        z-index: 1;
        width: 100%;
        height: 100%;
        border: 1px solid #00f;
        pointer-events: none;
      } */

    /* --- 動畫小物件 --- */
    .animate__wrap {
      position: relative;
      z-index: 1;
      transform: translateZ(0);
    }

    /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    .animate__wrap .animate__obj--01 {
      position: absolute;
      z-index: -1;
      top: 0vw;
      left: 45vw;
      width: 42.6%;
    }
    .animate__wrap .animate__obj--02 {
      position: absolute;
      z-index: -1;
      top: 36vw;
      left: 28.1vw;
      width: 14.1%;
    }
    .animate__wrap .animate__obj--03 {
      position: absolute;
      z-index: -1;
      top: 21.4vw;
      left: 80.3vw;
      width: 6.4%;
      transform-origin: 50% 100%;
    }
    .animate__wrap .animate__obj--04 {
      position: absolute;
      z-index: -1;
      top: 34vw;
      left: 93.4vw;
      width: 6.3%;
    }

    /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    @media screen and (min-width:960px) {
      .animate__wrap .animate__obj--01 {
        top: 0px;
        left: calc(50% - 45px);
        width: auto;
      }
      .animate__wrap .animate__obj--02 {
        top: 346px;
        left: calc(50% - 211px);
        width: auto;
      }
      .animate__wrap .animate__obj--03 {
        top: 206px;
        left: calc(50% - -291px);
        width: auto;
      }
      .animate__wrap .animate__obj--04 {
        top: 331px;
        left: calc(50% - -420px);
        width: auto;
      }
    }

    /* --- 動畫小物件 end --- */
  </style>
</head>

<!-- 是否要固定背景，不要就拿掉class -->
<body>

  <div class="navRightBar" id="navRightBar"></div>

            <li class="visual__fragment width--auto"><a href="https://www.etmall.com.tw/i/3533327"><img src="index_05.jpg" alt="KKLife 香濃起司肉捲"></a></li>

            <li class="visual__fragment width--auto"><a href="https://www.etmall.com.tw/i/3533528"><img src="index_07.jpg" alt="KKLife 蜂蜜蘋果醬烤豬肋排"></a></li>
          </ul>

        </div>
      </section>
    </main>
  </div>
  <!-- ============== 共用JS ============== -->
