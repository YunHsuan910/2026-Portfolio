  <style>

    body {
      position: relative;
    /* 背景顏色 */
      background-color: #0b2837;
    }

    body:before {
      content: '';
      position: absolute;
      z-index: -1;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url(bg-m.jpg) center 0 no-repeat;
      background-size: 100%;
    }

    @media screen and (min-width:960px) {
      body:before {
        background: url(bg.jpg) center 0 no-repeat;
        background-size: auto;
      }
    }

    body.bg-fixed:before {
      position: fixed;
      height: 100vh;
    }

    /* 調整logo位置大小 */
    /* .logo {
      top: 1%;
      left: 1%;
      width: 30%;
      max-width: 220px;
    } */

      /* 連結測試 */
      /* .sp__visual a{

      /* 切片測試 */
      /* .visual__fragment::before {
        content: '';
        position: absolute;
        z-index: 1;
        width: 100%;
        height: 100%;
        border: 1px solid #00f;
        pointer-events: none;
      } */

    /* --- 動畫小物件 --- */
    .animate__wrap {
      position: relative;
      z-index: 1;
      transform: translateZ(0);
    }

    /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    .animate__wrap .animate__obj--01 {
      position: absolute;
      z-index: -1;
      top: 2.2vw;
      left: 9.2vw;
      width: 81%;
    }

    /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    @media screen and (min-width:960px) {
      .animate__wrap .animate__obj--01 {
        top: 19px;
        left: calc(50% - 390px);
        width: auto;
      }
    }

    /* --- 動畫小物件 end --- */

    /* == BN輪播 == */
    .swipersty__banner {
        position: absolute;
        z-index: 3;
        left: 8%;
        width: 84%;
    }
    .swipersty__banner--top {
        top: 72.8%;
    }

    .layout--main {
      margin-right: auto;
      margin-left: auto;
      max-width: 960px;
    }

    /* ========== start ========== */
    .promo__group {

        margin-bottom: 32px;
      }
    }

    .promo__wrap {
      /*background-color: #faa;*/
      border-radius: 60px 0 60px 0;
    }

    .promo__items {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 4% 4% 2.5%;
    }

    .promo__item {
      width: 49%;
      margin-bottom: 2%;
    }

    @media screen and (min-width: 960px) {
      .promo__item {
        width: 20%;
      }
    }
    /* ========== end ========== */
  </style>
