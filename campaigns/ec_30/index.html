<style>
  body {
    /* 自行修正背景顏色 */
    background-color: #7ad37f;
  }
  .decor__bg {
    position: fixed;
    z-index: -1;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: url(bg-m.jpg)  center 0 no-repeat;
    background-size: 100%;
  }

  @media screen and (min-width: 960px) {
    .decor__bg {
      background: url(bg.jpg) center 0 no-repeat;
      background-size: auto;
    }
  }

  /* 調整logo位置大小 */
  .logo {
    top: 1%;
    left: 1%;
    width: 25%;
    max-width: 220px;
  }

  /* 連結測試 */
  /* .sp__visual a{
    filter: brightness(500%);
  } */

  /* 切片測試 */
  /* .visual__fragment::before {
    content: '';
    position: absolute;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 1px solid #00f;
    pointer-events: none;
  } */

  /*-- 動畫小物件 --*/
  /* ======================================== */
  .animate__wrap {
    position: relative;
    z-index: 1;
  }

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 4.2vw;
    left: 0.5vw;
    width: 57.5%;
    animation: floatball 2s ease-in-out infinite;
  }
  .animate__wrap .animate__obj--02 {
    position: absolute;
    top: 10.2vw;
    left: 80.5vw;
    width: 3.5%;
    transform-origin: 100% 0;
    animation: drop 2s ease-in-out infinite;
  }

  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 42px;
      left: calc(50% - 473px);
      width: auto;
    }
    @keyframes floatball{
      0%{
        transform: translateY(-20px);
      }
      50%{
        transform: translateY(0);
      }
      100%{
        transform: translateY(-20px);
      }
    }
    .animate__wrap .animate__obj--02 {
      top: 98px;
      left: calc(50% + 296px);
      width: auto;
    }
  }
  @keyframes floatball{
      0%{
        transform: translateY(3%);
      }
      50%{
        transform: translateY(0);
      }
      100%{
        transform: translateY(3%);
      }
    }
  @keyframes drop{
    0%{
      transform: scaleY(.8);
    }
    50%{
      transform: scaleY(1.1);
    }
    100%{
      transform: scaleY(.8);
    }
  }
  /* == 單(雙)連結輪播 == */
  .sp__main {
      position: relative;
      z-index: 0;
  }
  .promo__slider {
      position: absolute;
      z-index: 1;
      top: 21.4%;
      /* 小網左邊距離 */
      left: 54.3%;
      /* 小網圖片寬 */
      width: 44.2%;
      /* 圖片原始尺寸 */
      max-width: 424px;
      overflow: hidden;
      padding-bottom: 2%; /* 小網若翻轉時會裁到圖片，可以加這裡的數值 */
  }
  .promo__slider .slide__block {
      display: flex;
  }
  .promo__slider .slide__block a {
      display: block;
  }
  .promo__slider .slide__block img {
      max-width: 100%
  }
  @media screen and (min-width: 960px) {
      .promo__slider {
          /* 大網左邊距離 */
          left: calc(50% + 42px);
          top: 124px;
          width: 100%;
          overflow: visible;
      }
  }

  /* == 單(雙)連結輪播_第二組 == */
  .promo__slider_2 {
      position: absolute;
      z-index: 1;
      top: 20.4%;
      /* 小網左邊距離 */
      left: 55.3%;
      /* 小網圖片寬 */
      width: 44.2%;
      /* 圖片原始尺寸 */
      max-width: 424px;
      overflow: hidden;
      padding-bottom: 2%;
  }
  .promo__slider_2 .slide__block {
      display: flex;
  }
  .promo__slider_2 .slide__block a {
      display: block;
  }
  .promo__slider_2 .slide__block img {
      max-width: 100%
  }
  @media screen and (min-width: 960px) {
      .promo__slider_2 {
          /* 大網左邊距離 */
          left: calc(50% - -230px);
          overflow: visible;
      }
  }

  /* == 滑動Banner == */
  .swipersty__banner {
      position: absolute;
      z-index: 3;
      left: 8.5%;
      width: 83.3%;
  }
  .swipersty__banner--top {
      top: 26%;
  }
</style>

  <script>
  // // 單(雙)連結輪播
  var sliderMany = new Swiper( "#sliderMany", {
      autoplay: {
          delay: 2000,
          disableOnInteraction: false,
      },
      // 翻牌開始
      effect: 'flip',
          flipEffect: {
          rotate: 30,
          slideShadows: false,
      },
      // 翻牌結束
      grabCursor: true,
      loop: true,
      speed: 1000,
  } );
  // 單(雙)連結輪播 end

  } );

  // 滑動Banner
  var swiperstyBanner = new Swiper("#swiperstyBanner", {
      autoplay: {

          disableOnInteraction: false,
      },
      autoHeight: true,
      grabCursor: true,
      loop: true,
      speed: 1000,
  });
