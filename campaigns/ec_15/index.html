    <style>

      body {
        position: relative;
      /* 背景顏色 */
        background-color: #ffe1e3;
      }

      body:before {
        content: '';
        position: absolute;
        z-index: -1;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url(bg-m.jpg) center 0 no-repeat;
        background-size: 100%;
      }

      @media screen and (min-width:960px) {
        body:before {
          background: url(bg.jpg) center 0 no-repeat;
          background-size: auto;
        }
      }

      body.bg-fixed:before {
        position: fixed;
        height: 100vh;
      }

      /* 調整logo位置大小 */
      /* .logo {
        top: 1%;
        left: 1%;
        width: 30%;
        max-width: 220px;
      } */

        /* 連結測試 */
        /* .sp__visual a{
          filter: brightness(500%);
        } */

        /* 切片測試 */
        /* .visual__fragment::before {
          content: '';
          position: absolute;
          z-index: 1;
          width: 100%;
          height: 100%;
          border: 1px solid #00f;
          pointer-events: none;
        } */

      /* --- 動畫小物件 --- */
      .animate__wrap {
        position: relative;
        z-index: 1;
        transform: translateZ(0);
      }

      /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
      .animate__wrap .animate__obj--01 {
        position: absolute;
        z-index: -1;
        top: 10.2vw;
        left: 4.8vw;
        width: 14%;
      }
      .animate__wrap .animate__obj--02 {
        position: absolute;
        z-index: -1;
        top: 12vw;
        right: 3.2vw;
        width: 14%;
      }
      .animate__wrap .animate__obj--03 {
        position: absolute;
        z-index: -1;
        top: 2.2vw;
        left: 5.8vw;
        width: 87.6%;
      }
      .animate__wrap .animate__obj--04 {
        position: absolute;
        z-index: -1;
        top: 27.9vw;
        left: 1.8vw;
        width: 96%;
      }

      /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
      @media screen and (min-width:960px) {
        .animate__wrap .animate__obj--01 {
          top: 90px;
          left: calc(50% - 433px);
          width: auto;
        }
        .animate__wrap .animate__obj--02 {
          top: 116px;
          right: calc(50% - 450px);
          width: auto;
        }
        .animate__wrap .animate__obj--03 {
          top: 22px;
          left: calc(50% - 419px);
          width: auto;
        }
        .animate__wrap .animate__obj--04 {
          top: 262px;
          left: calc(50% - 479px);
          width: auto;
        }
      }

      /* 滾到位置才會出現的動畫 */
      .decor__item {
        position: absolute;
        z-index: 1;
        /* 小網位置 */
        top: 80.5%;
        right: 0.5vw;
        width: 18%;
        pointer-events: none;
      }

      /* 滾到位置時要加入的動畫，從animate.css找就可以 */
      .animate__scroll--01 {
        animation: fadeInTopLeft 1s linear, shakeY 8s ease-in-out infinite 2s;
      }

      @media screen and (min-width:960px) {
        .decor__item {
          /* 大網位置 */
          top: 2305px;
          left: calc(50% - -309px);
          width: 169px;
        }
      }
      /* --- 動畫小物件 end --- */


      /* --- 背景動畫調整 --- */
      .sp__wallper .bg__container .first-layer {
        background: url(bg-animate-1.png) center 0;
        /* 1會在主視覺的上層 */
        /* z-index: 1;  */
      }

      .sp__wallper .bg__container .second-layer {
        background: url(bg-animate-2.png) center 0;
        /* 1會在主視覺的上層 */
        /* z-index: 1;  */
      }

      .sp__wallper .bg__container .third-layer {
        background: url(bg-animate-3.png) center 0;
        /* 1會在主視覺的上層 */
        /* z-index: 1;  */
      }

      /* --- 背景動畫調整 end --- */

      /* 誘因鋪底區連結 */
      .activity_01{
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 50%;
      }
      .activity_02{
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 50%;
      }
      .activity_03{
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 50%;
      }

    </style>
