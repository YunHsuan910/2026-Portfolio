<style>
  body {
    position: relative;
    /* 自行修正背景顏色 */
    background-color: #4e3822;
  }

  body::before {
    content: '';
    position: absolute;
    z-index: -1;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url(bg-m.jpg) center 0 no-repeat;
    background-size: 100%;
  }

  @media screen and (min-width: 960px) {
    body::before {
      background: url(bg.jpg) center 0 no-repeat;
      background-size: auto;
    }
  }

  body.bg-fixed::before {
    position: fixed;
    height: 100vh;
  }

  /* 調整logo位置大小 */
  /* .logo {
    top: 1%;
    left: 1%;
    width: 30%;
    max-width: 220px;
  } */

  /* 連結測試 */
  /* .sp__visual a{
    filter: brightness(500%);
  } */

  /* 切片測試 */
  /* .visual__fragment::before {
    content: '';
    position: absolute;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 1px solid #00f;
    pointer-events: none;
  } */

  /*-- 動畫小物件 --*/
  /* ======================================== */
  .animate__wrap {
    position: relative;
    z-index: 1;
  }

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 7vw;
    left: 32vw;
    width: 26%;
  }
  .animate__wrap .animate__obj--02 {
    position: absolute;
    top: 70vw;
    left: 30vw;
    width: 28%;
  }
  .animate__wrap .animate__obj--03 {
    position: absolute;
    top: 64.5vw;
    left: 1vw;
    width: 22%;
  }

  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 67px;
      left: calc(50% - 175px);
      width: auto;
    }
    .animate__wrap .animate__obj--02 {
      top: 670px;
      left: calc(50% - 190px);
      width: auto;
    }
    .animate__wrap .animate__obj--03 {
      top: 619px;
      left: calc(50% - 470px);
      width: auto;
    }
  }
</style>

<!-- 是否要固定背景，不要就拿掉 -->
<body>

            </li>
            <li class="visual__fragment width--auto">

                <img src="index_05.jpg" alt="陽明春天x善菓蔬食">
              </a>
            </li>
            <li class="visual__fragment width--auto">

            <li class="visual__fragment width--auto">
              <a href="https://media.etmall.com.tw/sp/14078/m/index.html" title="大成x西雅圖">

            <li class="visual__fragment width--auto">

          </ul>
        </div>
      </section>
    </main>
  </div>
  <script src="https://www.etmall.com.tw/Scripts/lib/jquery/jquery-2.2.0.min.js"></script>

  <script>
    //- 如果在sp-elevator.css裡面把下方欄位(.footer__box)改成display:none的話，把預留出來的空間刪掉
    $( function () {
