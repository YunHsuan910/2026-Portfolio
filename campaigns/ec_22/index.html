    body {
      background-color: #f9f4e1;

    body:before {

      background-size: 100%;
    }

    @media screen and (min-width: 960px) {

        background-size: auto;
      }
    }

    /* 調整logo位置大小 */
    /* .logo {
        top: 1%;
        left: 1%;
        width: 30%;
        max-width: 220px;
      } */

    /* --- 動畫小物件 --- */
    .animate__wrap {
      z-index: 1;
    }

    /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    .animate__wrap .animate__obj--01 {
      position: absolute;
      z-index: -1;
      top: 6.4vw;
      left: 14vw;
      width: 76%;
    }
    .animate__wrap .animate__obj--02 {
      position: absolute;
      z-index: -1;
      top: 10.8vw;
      left: 13vw;
      width: 80%;
    }

    /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    @media screen and (min-width: 960px) {
      .animate__wrap .animate__obj--01 {
        top: 62px;
        left: calc(50% - 349px);
        width: auto;
      }
      .animate__wrap .animate__obj--02 {
        top: 102px;
        left: calc(50% - 356px);
        width: auto;
      }
    }

    /* 滾到位置才會出現的動畫 */
    .decor__item {
      position: absolute;
      z-index: 1;
      /* 小網位置 */
      top: 522vw;
      left: 2.5%;
      width: 94%;
    }

    /* 滾到位置時要加入的動畫，從animate.css找就可以 */
    .animate__scroll--01 {
      animation: jackInTheBox 1s linear 1;
    }

    @media screen and (min-width: 960px) {
      .decor__item {
        /* 大網位置 */
        top: 5012px;
        left: calc(50% - 454px);
        width: auto;
      }
    }

    /* --- 動畫小物件 end --- */

    /* --- 滑動Banner start --- */
    .banner__slider {
      /* 輪播的父層 */
      z-index: 0;
    }

    .banner__slider .swipersty__banner {
      position: absolute;
      z-index: 0;
      top: 0%;
      left: 0%;
      width: 100%;
    }

    .banner__slider .swipersty__series {
      position: absolute;
      z-index: 0;
      top: 0%;
      left: 12%;
      width: 76%;
    }
    
    /* --- 滑動Banner end --- */

    /* --- 背景動畫調整 --- */

      /* 1會在主視覺的上層 */
      /* z-index: 1;  */
    }

    /* --- 背景動畫圖片們--- */

    .bg__container.falling .bg--first {

    }

  <script>
    // 商品輪播
     var swiperstyBanner = new Swiper("#swiperstyProduct", {
        autoplay: {
          delay: 2000,
          disableOnInteraction: false,
        },
        grabCursor: true,
        lazy: {
          loadPrevNext: true,
        },
        loop: true,
        perspective: true,
        effect: "flip",
        flipEffect: {
          slideShadows: false,
        },
        slidesPerView: 1,
        speed: 1000,
        watchSlidesProgress : true,
        watchSlidesVisibility : true,
    });
    // 商品輪播 end
    
    var swiperSeries = new Swiper("#swiperstySeries", {
      autoplay: {
          delay: 2000,
          disableOnInteraction: false,
        },
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: "2",
      loop: true,
      coverflowEffect: {
        rotate: 50,
        stretch: 0,
        depth: 500,
        modifier: 1,
        slideShadows: false,
      },
    });
  

  </script>
