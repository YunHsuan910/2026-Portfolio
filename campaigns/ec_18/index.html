    body {

    }

    body:before {
      content: '';
      position: absolute;
      z-index: -1;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url(bg-m.jpg) center 0 no-repeat;
      background-size: 100%;
    }

    @media screen and (min-width:960px) {
      body:before {
        background: url(bg.jpg) center 0 no-repeat;

      }
    }

    body.bg-fixed:before {

    /* --- 動畫小物件 --- */
    .animate__wrap {

      z-index: 1;
      transform: translateZ(0);
    }

    /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    .animate__wrap .animate__obj--01 {
      position: absolute;
      z-index: -1;
      top: 7.8vw;
      left: 11.4vw;
      width: 78%;
    }
    .animate__wrap .animate__obj--02 {
      position: absolute;
      z-index: -1;
      top: 47.8vw;
      left: 8.4vw;
      width: 81%;
    }
    /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    @media screen and (min-width:960px) {
      .animate__wrap .animate__obj--01 {
        top: 75px;
        left: calc(50% - 371px);
        width: auto;
      }
      .animate__wrap .animate__obj--02 {
        top: 457px;
        left: calc(50% - 400px);
        width: auto;
      }
    }

    /* --- 動畫小物件 end --- */

    .swipersty__banner {

        z-index: 3;
        left: 3%;
        width: 91%;
    }
    .swipersty__banner--top {
        top: 92.2%;
    }
