<style>
  body {
    position: relative;
    /* 自行修正背景顏色 */
    background-color: #ffdfec;
  }

  body::before {
    content: '';
    position: absolute;
    z-index: 0;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url(bg-m.jpg) center 0 no-repeat;
    background-size: 100%;
  }

  @media screen and (min-width: 960px) {
    body::before {
      background: url(bg.jpg) center 0 no-repeat;
      background-size: auto;
    }
  }

  body.bg-fixed::before {
    position: fixed;
    height: 100vh;
  }

  /* 調整logo位置大小 */
  /* .logo {

  /*-- 動畫小物件 --*/
  /* ======================================== */
  .animate__wrap {
    position: relative;
    z-index: 1;
  }

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 32.2vw;
    left: 1.8vw;
    width: 18%;
    animation: flowers reverse 5s linear .5s infinite;
  }
  .animate__wrap .animate__obj--02 {
    position: absolute;
    top: 34.3vw;
    left: 86.8vw;
    width: 12%;
    animation: flowers 3s linear 1s infinite;
  }
  .animate__wrap .animate__obj--03 {
    position: absolute;
    top: 10.5vw;
    left: 13vw;
    width: 70%;
  }

  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 311px;
      left: calc(50% - 462px);
      width: auto;
    }
    .animate__wrap .animate__obj--02 {
      top: 332px;
      left: calc(50% + 358px);
      width: auto;
    }
    .animate__wrap .animate__obj--03 {
      top: 72px;
      left: calc(50% - 365px);
      width: 700px;
    }
  }
  @keyframes flowers {
    0%{
      transform: rotate(0deg);
    }
    100%{
      transform: rotate(360deg);
    }
  }
</style>
