<style>
  body {
    position: relative;
    /* 自行修正背景顏色 */
    background-color: #fffae1;
  }

  body::before {
    content: '';
    position: absolute;
    z-index: -1;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: center 0 no-repeat;
    background-size: 100%;
  }

  @media screen and (min-width: 960px) {
    body::before {
      background: url(bg.jpg) center 0 no-repeat;
      background-size: auto;
    }
  }

  body.bg-fixed::before {
    position: fixed;
    height: 100vh;
  }

  /* 調整logo位置大小 */
  /* .logo {
    top: 1%;
    left: 1%;
    width: 30%;

  } */

  /* 連結測試 */
  /* .sp__visual a{

  } */

  /* 切片測試 */
  /* .visual__fragment::before {
    content: '';
    position: absolute;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 1px solid #00f;
    pointer-events: none;
  } */

  /*-- 動畫小物件 --*/
  /* ======================================== */
  .animate__wrap {
    position: relative;
    z-index: 1;
    transform: translateZ(0);
  }

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 5.2vw;
    left: 33.1vw;
    width: 32%;
  }
  .animate__wrap .animate__obj--02 {
    position: absolute;
    top: 74.2vw;
    left: 1vw;
    width: 8%;
  }
  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 50px;
      left: calc(50% - 159px);
      width: auto;
    }
    .animate__wrap .animate__obj--02 {
      top: 709px;
      left: calc(50% - 475px);
      width: auto;
    }
  }

  /* == 商品輪播 == */
.swipersty__banner {
      position: absolute;
      z-index: 3;
      left: 8.5%;
      width: 80%;
  }
  .swipersty__banner--top {
      top: 91%;
  }
</style>
