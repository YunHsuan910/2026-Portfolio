  <!-- [電梯步驟1] 電梯CSS 不用就關掉 -->

<style>
  body {
    position: relative;
    /* 自行修正背景顏色 */
    background-color: #e6cec2;
  }

  body::before {
    content: '';
    position: absolute;
    z-index: -1;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url(bg-m.jpg) center 0 no-repeat;
    background-size: 100%;
  }

  @media screen and (min-width: 960px) {
    body::before {
      background: url(bg.jpg) center 0 no-repeat;
      background-size: auto;
    }
  }

  body.bg-fixed::before {
    position: fixed;
    height: 100vh;
  }

  /* 調整logo位置大小 */
  /* .logo {
    top: 1%;
    left: 1%;
    width: 30%;
    max-width: 220px;
  } */

  /* 連結測試 */
  /* .sp__visual a{
    filter: brightness(500%);
  } */

  /* 切片測試 */
  /* .visual__fragment::before {
    content: '';
    position: absolute;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 1px solid #00f;
    pointer-events: none;
  } */

  /*-- 動畫小物件 --*/
  /* ======================================== */
  .animate__wrap {
    position: relative;
    z-index: 1;
  }

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 5vw;
    left: 13vw;
    width: 47.5%;
  }

  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 47px;
      left: calc(50% - 358px);
      width: auto;
    }
  }
</style>

<!-- 是否要固定背景，不要就拿掉 -->
<body>

  <div class="elevatorHome js--main--dialog" id="elevatorHome"></div>
  <div class="navRightBar" id="navRightBar"></div>
  <!--<div id="barHome"></div>-->

  <div id="spWrap" class="sp__wallper">

        src="ani.png" alt="閃亮亮">
    </div>
    <!-- 主視覺 -->
    <main class="sp__main">
      <div class="layout--main home--logo">
        <a href="https://www.etmall.com.tw"><img class="logo" src="ehs-logo.png" alt="東森購物"></a>
      </div>
      <section class="sp__visual">
        <div class="layout--main">

              <img src="index_01.jpg" title="宅家寵媽咪" alt="宅家寵媽咪">

            <li class="visual__fragment width--auto">

            </li>

            </li>
            <li class="visual__fragment width--auto">
              <a href="https://www.etmall.com.tw/i/3458094" title="好神拖">
                <img src="index_04.jpg" alt="好神拖">
              </a>
            </li>
            <li class="visual__fragment width--auto">
              <a href="https://www.etmall.com.tw/i/3449332" title="李施德霖">
                <img src="index_05.jpg" alt="李施德霖">
              </a>
            </li>
            <li class="visual__fragment width--auto">
              <a href="https://www.etmall.com.tw/i/3109717" title="德國BRITA">

              </a>
            </li>
            <li class="visual__fragment width--auto">

          </ul>
        </div>
      </section>
    </main>
  </div>
  <script src="https://www.etmall.com.tw/Scripts/lib/jquery/jquery-2.2.0.min.js"></script>

  <script>
    //- 如果在sp-elevator.css裡面把下方欄位(.footer__box)改成display:none的話，把預留出來的空間刪掉
    $( function () {
      var display = $( "#footerBox" ).css( "display" );
      if ( display === "none" ) {
        $( "body" ).removeClass( "safe-area-padding-bottom" );
      }
    } );
