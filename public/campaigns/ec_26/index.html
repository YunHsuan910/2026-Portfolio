<style>
  body {
    position: relative;
    /* 自行修正背景顏色 */
    background-color: #342e26;
  }

  body::before {
    content: '';
    position: absolute;
    z-index: -1;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url(bg-m.jpg) center 0 no-repeat;
    background-size: 100%;
  }

  @media screen and (min-width: 960px) {
    body::before {
      background: url(bg.jpg) center 0 no-repeat;
      background-size: auto;
    }
  }

  body.bg-fixed::before {
    position: fixed;
    height: 100vh;
  }

  /* 調整logo位置大小 */
  /* .logo {
    top: 1%;
    left: 1%;
    width: 30%;
    max-width: 220px;
  } */

  /* 連結測試 */
  /* .sp__visual a{
    filter: brightness(500%);
  } */

  /* 切片測試 */
  /* .visual__fragment::before {
    content: '';
    position: absolute;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 1px solid #00f;
    pointer-events: none;
  } */

  /* == 單(雙)連結輪播_第二組 == */
  .promo__slider_2 {
    position: absolute;
    top: 30.1%;
    /* 小網圖片寬 */
    width: 100%;
    /* 圖片原始尺寸 */
    max-width: 100%;
    overflow: hidden;
    padding-bottom: 2%;
  }

  .promo__slider_2 .slide__block {
    display: flex;
  }

  .promo__slider_2 .slide__block a {
    display: block;
  }

  .promo__slider_2 .slide__block img {
    max-width: 100%;
    z-index: 2;
  }

  @media screen and (min-width: 960px) {
    .promo__slider_2 {
      /* 大網左邊距離 */
      left: calc(50% - 474px);
      overflow: visible;
    }
  }

  /*-- 動畫小物件 --*/
  /* ======================================== */
  .animate__wrap {
    position: relative;
    z-index: 1;
    transform: translateZ(0);
  }

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 26.2vw;
    left: 27vw;
    width: 14%;
  }

  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 252px;
      left: calc(50% - 219px);
      width: auto;
    }
  }
/* == 商品輪播 == */
.swipersty__banner {
      position: absolute;
      z-index: 3;
      left: 12%;
      width: 76%;
  }
  .swipersty__banner--top {
      top: 29%;
  }

</style>
