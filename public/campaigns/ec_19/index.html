    <style>
      body {
        position: relative;
        /* 背景顏色 */
        background-color: #0e0702;
      }

      body:before {
        content: "";
        position: absolute;
        z-index: -1;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url(bg-m.jpg) center 0 no-repeat;
        background-size: 100%;
      }

      @media screen and (min-width: 960px) {
        body:before {
          background: url(bg.jpg) center 0 no-repeat;
          background-size: auto;
        }
      }

      body.bg-fixed:before {
        position: fixed;
        height: 100vh;
      }

      /* 調整logo位置大小 */
      /* .logo {
      top: 1%;

    } */

      /* 連結測試 */
      /* .sp__visual a{

      /* 切片測試 */
      /* .visual__fragment::before {
        content: '';
        position: absolute;
        z-index: 1;
        width: 100%;
        height: 100%;
        border: 1px solid #00f;
        pointer-events: none;
      } */

      /* --- 動畫小物件 --- */
      .animate__wrap {
        position: relative;
        z-index: 1;
        transform: translateZ(0);
      }

      /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
      .animate__wrap .animate__obj--01 {
        position: absolute;
        z-index: -1;
        top: 34vw;
        left: 7vw;
        width: 44%;
      }

      /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
      @media screen and (min-width: 960px) {
        .animate__wrap .animate__obj--01 {
          top: 326px;
          left: calc(50% - 413px);
          width: auto;
        }
      }
      /* == 商品輪播 == */
      .swipersty__product {
        position: absolute;
        z-index: 3;
        right: 0.7%;
        width: 44%;
      }
      .swipersty__product--top {
        top: 2.2%;
      }
      /* == BN輪播 == */
      .swipersty__banner {
        position: absolute;
        z-index: 3;
        left: 8%;
        width: 84%;
      }
      .swipersty__banner--top {
        top: 32%;
      }

      /* --- 動畫小物件 end --- */

      .layout--main {
      margin-right: auto;
      margin-left: auto;
      max-width: 960px;
    }
