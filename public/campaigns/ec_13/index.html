    body {

    /* 調整logo位置大小 */
    /* .logo {
        top: 1%;
        left: 1%;

      } */

    /* --- 動畫小物件 --- */
    .animate__wrap {
      z-index: 1;
    }
    .animate__wrap--02 {
      z-index: -1;
    }

    /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    .animate__wrap .animate__obj--01 {
      position: absolute;
      z-index: -1;
      top: 10.2vw;
      left: 0.6vw;
      width: 63.3%;
    }
    .animate__wrap--02 .animate__obj--02 {
      position: absolute;
      z-index: -1;
      top: 0vw;
      left: 33.6vw;
      width: 66.3%;
      pointer-events: none;
    }

    /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    @media screen and (min-width: 960px) {
      .animate__wrap .animate__obj--01 {
        top: 95px;
        left: calc(50% - 478px);
        width: auto;
      }
      .animate__wrap--02 .animate__obj--02 {
        top: -1px;
        left: calc(50% - 147px);
        width: auto;
      }
    }

    /* --- 動畫小物件 end --- */

    /* --- 滑動Banner start --- */
    .banner__slider {
      /* 輪播的父層 */
      z-index: 0;
    }

    .banner__slider .swipersty__pp {
      position: absolute;
      z-index: 0;
      top: 0%;
      left: 0%;
      width: 100%;
    }
    .swiper-2-link{
      position: absolute;
      width: 50%;
      height: 100%;
    }
    .right-link{
      left: 50%;
    }

      .banner__slider .swipersty__banner {
        position: absolute;
        z-index: 0;
        top: 21.5%;
        left: 12%;
        width: 76%;
      }
    /* --- 滑動Banner end --- */
