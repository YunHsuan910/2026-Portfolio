  <!-- [電梯步驟1] 電梯CSS 不用就關掉 -->

  <!-- 商品右電梯CSS，步驟2有測試div可以測試 -->

<style>
  body {
    /* 自行修正背景顏色 */
    background-color: #917043;
  }

  /* 調整logo位置大小 */
  .logo {
      top: 1%;
      left: 1%;
      width: 22%;
      max-width: 220px;
    }

  /* 連結測試 */
  /* .sp__visual a{
      filter: brightness(500%);
    } */

  /* 切片測試 */
  /* .visual__fragment::before {
      content: '';
      position: absolute;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 1px solid #00f;
      pointer-events: none;
    } */

  /* 設定全畫面背景 */
  /* .sp__main {
      background: url(bg.jpg) center 0 no-repeat;
    } */

  /* 大網各區塊背景  */
  @media screen and (min-width: 960px) {
    .visual__block1 {
      background: url(bg_01.jpg) center 0 no-repeat;
    }
  }

  /*-- 動畫小物件 --*/
  .animate__wrap {
    position: relative;
    z-index: 1;
  }

  /*-- 手機版：
            1. 設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw"
            2. width 建議電腦版可以使用auto，手機版則可使用%調整
  --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 42.6vw;
    left: 13.5vw;
    width: 41%;
    animation: fog 3s ease-out infinite;
    transition: all .3s;
  }
  .animate__wrap .animate__obj--02 {
    position: absolute;
    top: 50.5vw;
    left: 21.5vw;
    width: 55.5%;
    animation: scrollOpen .4s linear;
    transition: all .3s;
  }
  .animate__wrap .animate__obj--03 {
    position: absolute;
    top: 3.5vw;
    left: 49.5vw;
    width: 76.5%;
    display: none;
  }
  .animate__wrap .animate__obj--04 {
    position: absolute;
    top: 3.5vw;
    left: -25.5vw;
    width: 81.5%;
    display: none;
  }
  .animate__wrap .animate__obj--05 {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: block;
  }
  .animate__wrap .animate__obj--06 {
    position: absolute;
    top: 0;
    left: 40vw;
    width: 24%;
  }



  /*-- 電腦版：
            設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值
            width 建議電腦版可以使用auto，手機版則可使用%調整
  --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 409px;
      left: calc(50% - 356px);
      width: auto;
    }
    .animate__wrap .animate__obj--02 {
      top: 489px;
      left: calc(50% - 274px);
      width: auto;
    }
    .animate__wrap .animate__obj--03 {
      top: 36px;
      left: calc(50% - 1px);
      width: auto;
      animation-delay: .5s;
      display: block;
    }
    .animate__wrap .animate__obj--04 {
      top: 36px;
      left: calc(50% - 729px);
      width: auto;
      display: block;
    }
    .animate__wrap .animate__obj--05 {
      display: none;
    }
    .animate__wrap .animate__obj--06 {
      top: 0;
      left: calc(50% - 96px);
      width: auto;
    }
  }
  @keyframes fog {
    0%{
      opacity: 0;
    }
    50%{
      opacity: 1;
    }
    100%{
      opacity: 0;
    }
  }
  @keyframes scrollOpen {
    0%{
      transform: scaleX(0);
    }
    100%{
      transform: scaleX(1);
    }
  }

</style>
<div class="elevatorHome js--main--dialog" id="elevatorHome"></div>
<div class="navRightBar" id="navRightBar"></div>

<div id="iconHome" class="layout--main home--icon"></div>

<div id="spWrap" class="sp__wallper">

  <div class="animate__wrap">
    <img class="animate__obj--01" src="ani_01.png" alt="">
    <img class="animate__obj--02" src="ani_02.png" alt="">
    <img class="animate__obj--03 animate__animated animate__fadeInRight" src="ani_03.png" alt="">
    <img class="animate__obj--04 animate__animated animate__fadeInLeft" src="ani_04.png" alt="">
    <img class="animate__obj--05" src="ani.png" alt="">
    <img class="animate__obj--06 animate__animated animate__flash animate__infinite" src="ani_05.png" alt="">
    <!-- 如果有多組物件，可以複製命名animate__obj--0{數字} css 也複製一份就可以一直往下生 -->
  </div>
  <!-- 主視覺 -->
  <main class="sp__main">
    <div class="layout--main home--logo">
      <a href="https://www.etmall.com.tw"><img class="logo" src="ehs-logo.png" alt="東森購物"></a>
    </div>
    <section class="sp__visual visual__block1">
      <div class="layout--main">
        <ul class="visual--auto clearfix">
          <li class="visual__fragment width--auto">
            <img src="index_01.jpg">
          </li>

        </ul>
      </div>
    </section>
  </main>
</div>
