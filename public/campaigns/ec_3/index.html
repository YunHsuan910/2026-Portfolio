<style>
  body {
    position: relative;
    /* 自行修正背景顏色 */
    background-color: #ffd850;
  }

  body::before {
    content: '';
    position: absolute;
    z-index: -1;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url(bg-m.jpg) center 0 no-repeat;
    background-size: 100%;
  }

  @media screen and (min-width: 960px) {
    body::before {
      background: url(bg.jpg) center 0 no-repeat;
      background-size: auto;
    }
  }

  body.bg-fixed::before {
    position: fixed;
    height: 100vh;
  }

  /*-- 動畫小物件 --*/

  .animate__wrap {

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/

    position: absolute;
    top: 47vw;
    left: 15vw;
    width: 66%;
  }
  .animate__wrap .animate__obj--02 {
    position: absolute;
    top: 30.2vw;
    left: 78.5vw;

  }

  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 449px;
      left: calc(50% - 334px);
      width: auto;
    }
    .animate__wrap .animate__obj--02 {
      top: 289px;
      left: calc(50% + 274px);
      width: auto;
    }
  }

</style>
