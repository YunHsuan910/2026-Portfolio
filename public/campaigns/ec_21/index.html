  <style>
    body {
      background-color: #e5ecff;
    }

    body:before {
      background: url(bg-m.jpg) center 0 no-repeat;
      background-size: 100%;
    }

    @media screen and (min-width: 960px) {
      body:before {
        background: url(bg.jpg) center 0 no-repeat;
        background-size: auto;
      }
    }

    /* 調整logo位置大小 */
    /* .logo {
        top: 1%;
        left: 1%;
        width: 30%;
        max-width: 220px;
      } */

    /* --- 動畫小物件 --- */
    .animate__wrap {
      z-index: 1;
    }
    .animate__wrap--02 {
      z-index: -1;
    }

    /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    .animate__wrap .animate__obj--01 {
      position: absolute;
      z-index: -1;
      top: 8.2vw;
      left: 14vw;
      width: 66.3%;
    }
    .animate__wrap .animate__obj--02 {
      position: absolute;
      z-index: -1;
      top: 17vw;
      left: 2vw;
      width: 97%;
    }
    .animate__wrap--02 .animate__obj--03 {
      position: fixed;
      z-index: -1;
      top: 0vw;
      right: -5vw;
      width: 28%;
      animation: flow 3s ease-in-out infinite 1s;
      /* pointer-events: none; */
    }

    /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    @media screen and (min-width: 960px) {
      .animate__wrap .animate__obj--01 {
        top: 77px;
        left: calc(50% - 344px);
        width: auto;
      }
      .animate__wrap .animate__obj--02 {
        top: 162px;
        left: calc(50% - 464px);
        width: auto;
      }
      .animate__wrap--02 .animate__obj--03 {
        top: 0px;
        left: calc(50% - -260px);
        width: auto;
      }
    }

    @keyframes flow {
      0%{
        transform: translateY(0);
      }
      50%{
        transform: translateY(-10px);
      }
      0%{
        transform: translateY(0);
      }
    }

    /* --- 動畫小物件 end --- */

    /* --- 背景動畫調整 --- */

    .bg__container .bg--first {
      /* 1會在主視覺的上層 */
      /* z-index: 1;  */

      /* z-index: 1; */

      /* z-index: 1;  */
    }


    /* --- 隨機飄落圖片 start--- */

    :root {
      /* --- 圖片隨機飄落參數 --- */
      --number: 14;
      --size: 14;
      --time: 4;
    }

    @media screen and (min-width: 960px) {
      :root {
        /* --- 圖片隨機飄落參數 --- */
        --number: 24;
        --size: 22;
        --time: 6;
      }
    }

    .bg__container.falling-random{
      /* 1會在主視覺的上層 */
      z-index: 0;
    }
    .bg__container{
      pointer-events: visible;
    }

    /* --- 隨機飄落圖片 end--- */

        /* color: #fff; */
      }
    }

    @media screen and (min-width: 1213px){

        /* 大網右電梯文字顏色 */
        /* color: #000; */
      }
      .sp-right__nav li a.active, .sp-right__nav a:hover{
        /* 大網右電梯文字hover顏色 */
        /* color: #d10001; */
      }
      .sp-right__nav li a.active:after, .sp-right__nav a:hover:after{
        /* 大網右電梯TITLE圈圈的hover顏色 */

        /* border: 3px solid #d10001; */
      }
    }
    /* --- 電梯換色 end--- */

    /* --- 背景動畫圖片們--- */

    .bg__container.falling .bg--first {
      background: url(bg-animate-1.png) center 0;
    }

    .bg__container.falling .bg--second {
      background: url(bg-animate-2.png) center 0;
    }

    .bg__container.falling .bg--third {
      background: url(bg-animate-3.png) center 0;
    }

    .bg__container.falling-center .bg--first {
      background: url(bg-animate-1.png) center 0;
    }

    .bg__container.rain .bg--first,
    .bg__container.rain .bg--second {
      background-image: url(bg-rain.png);
    }

    .bg__container.snow .falling__block {
      background-image: url(bg-snow.png);
    }

    .random__layer .falling-random-image {
      background: url(falling-random-image.png) center 0 no-repeat;
      background-size: 100%;
    }

  </style>
