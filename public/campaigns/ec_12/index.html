    body {
      background-color: #0b2965;
    }

    body:before {
      background: url(bg-m.jpg) center 0 no-repeat;
      background-size: 100%;
    }

    @media screen and (min-width: 960px) {
      body:before {
        background: url(bg.gif) center 0 no-repeat;
        background-size: auto;
      }
    }

    /* 調整logo位置大小 */
    .logo {
        top: 1%;
        left: 1%;
        width: 25%;
        max-width: 220px;
      }

    /* --- 動畫小物件 --- */
    .animate__wrap {
      z-index: 1;
    }
    .animate__wrap--02 {
      z-index: -1;
    }

    /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    .animate__wrap .animate__obj--01 {
      position: absolute;
      z-index: -1;
      top: 15vw;
      left: 1.7vw;
      width: 34%;
      animation-delay: 1.5s;
    }
    .animate__wrap .animate__obj--02 {
      position: absolute;
      z-index: -1;
      top: 18.3vw;
      right: 0vw;
      width: 30%;
      animation-delay: 1.5s;
    }
    .animate__wrap .animate__obj--03 {
      position: absolute;
      z-index: -1;
      top: 5.2vw;
      left: 16vw;
      width: 74%;
    }
    .animate__wrap--02  .animate__obj--04,
    .animate__wrap--02  .animate__obj--05 {
      position: fixed;
      display: none;
    }

    /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
    @media screen and (min-width: 960px) {
      .animate__wrap .animate__obj--01 {
        top: 102px;
        left: calc(50% - 467px);
        width: auto;
      }
      .animate__wrap .animate__obj--02 {
        top: 175px;
        left: calc(50% - -180px);
        width: auto;
      }
      .animate__wrap .animate__obj--03 {
        top: 52px;
        left: calc(50% - 325px);
        width: auto;
      }
      .animate__wrap--02 .animate__obj--04 {
        display: block;
        position: fixed;
        top: 530px;
        left: calc(50% - -513px);
        width: auto;
        animation: flow 3s ease-in-out infinite;
      }
      .animate__wrap--02 .animate__obj--05 {
        display: block;
        position: fixed;
        top: 502px;
        left: calc(50% - 950px);
        width: auto;
        animation: flow 3s ease-in-out infinite 1s;
      }
    }
    @keyframes flow {
      0%{
        transform: translateY(0);
      }
      50%{
        transform: translateY(20px);
      }
      0%{
        transform: translateY(0);
      }
    }
    /* 滾到位置才會出現的動畫 */
    .decor__item {
      position: absolute;
      z-index: 1;
      /* 小網位置 */
      top: 80%;
      left: 25%;
      width: 70%;
    }

    /* 滾到位置時要加入的動畫，從animate.css找就可以 */
    .animate__scroll--01 {
      animation: jackInTheBox 1s linear 1;
    }

    @media screen and (min-width: 960px) {
      .decor__item {
        /* 大網位置 */
        top: 2140px;
        left: calc(50% - 200px);
        width: auto;
      }
    }

    /* --- 動畫小物件 end --- */

    .bn-w4m4 .banner__item{

      transform: scale(1.05);

    @keyframes falling-down {
        0% {
          background-position: 0 0;
          opacity: 0
        }

        10%,
        90% {

        }

        100% {

    @media screen and (min-width: 960px) {

          background-position: 100% 150vh;
