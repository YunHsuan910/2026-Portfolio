<style>
  body {
    position: relative;
    /* 自行修正背景顏色 */
    background-color: #fff5dd;
  }

  body::before {
    content: '';
    position: absolute;
    z-index: 0;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url(bg-m.jpg) center 0 no-repeat;
    background-size: 100%;
  }

  @media screen and (min-width: 960px) {
    body::before {
      background: url(bg.jpg) center 0 no-repeat;
      background-size: auto;
    }
  }

  body.bg-fixed::before {
    position: fixed;
    height: 100vh;
  }

  /* 調整logo位置大小 */
  .logo {
    top: 1%;
    left: 1%;
    width: 26%;
    max-width: 220px;
  }

  /* 連結測試 */
  /* .sp__visual a{
    filter: brightness(500%);
  } */

  /* 切片測試 */
  /* .visual__fragment::before {
    content: '';
    position: absolute;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 1px solid #00f;
    pointer-events: none;
  } */

  /*-- 動畫小物件 --*/
  /* ======================================== */
  .animate__wrap {
    position: relative;
    z-index: 1;
  }

  /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  .animate__wrap .animate__obj--01 {
    position: absolute;
    top: 22vw;
    left: 25vw;
    width: 17.5%;
  }
  .animate__wrap .animate__obj--02 {
    position: absolute;
    top: 23vw;
    left: 43vw;
    width: 13.5%;
    animation-delay: .5s;
  }
  .animate__wrap .animate__obj--03 {
    position: absolute;
    top: 26vw;
    left: 55.5vw;
    width: 15.5%;
    animation-delay: 1s;
  }
  .animate__wrap .animate__obj--04 {
    position: absolute;
    top: 40vw;
    left: 4vw;
    width: 20%;
  }

  /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
  @media screen and (min-width: 960px) {
    .animate__wrap .animate__obj--01 {
      top: 212px;
      left: calc(50% - 238px);
      width: auto;
    }
    .animate__wrap .animate__obj--02 {
      top: 219px;
      left: calc(50% - 72px);
      width: auto;
    }
    .animate__wrap .animate__obj--03 {
      top: 251px;
      left: calc(50% + 55px);
      width: auto;
    }
    .animate__wrap .animate__obj--04 {
      top: 383px;
      left: calc(50% - 445px);
      width: auto;
    }
  }
</style>
