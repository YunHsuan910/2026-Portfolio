    <style>

      body {
        position: relative;
      /* 背景顏色 */
        background-color: #f5efee;
      }
  
      body:before {
        content: '';
        position: absolute;
        z-index: -1;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url(bg-m.jpg) center 0 no-repeat;
        background-size: 100%;
      }
  
      @media screen and (min-width:960px) {
        body:before {
          background: url(bg.gif) center 0 no-repeat;
          background-size: auto;
        }
      }
  
      body.bg-fixed:before {
        position: fixed;
        height: 100vh;
      }
      .none--pointer{
        pointer-events: none;
      }
      /* 調整logo位置大小 */
      .logo {
        top: 1%;
        left: 1%;
        width: 25%;
        max-width: 220px;
      }
  
        /* 連結測試 */
        /* .sp__visual a{
          filter: brightness(500%);
        } */
  
        /* 切片測試 */
        /* .visual__fragment::before {
          content: '';
          position: absolute;
          z-index: 1;
          width: 100%;
          height: 100%;
          border: 1px solid #00f;
          pointer-events: none;
        } */
        
      /* --- 動畫小物件 --- */
      .animate__wrap {
        position: relative;
        z-index: 1;
        transform: translateZ(0);
      }
  
      /*-- 手機版：設定物件距離左邊與上邊的位置，單位可以使用"%"或"vw";width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
      .animate__wrap .animate__obj--01 {
        position: absolute;
        z-index: -1;
        top: 10.2vw;
        left: 5vw;
        width: 45%;
      }
  
      /*-- 電腦版：設定物件距離左邊與上邊的位置，單位可以使用"px"，左邊可以挑整clac()後面的px值;width:建議電腦版可以使用auto，手機版則可使用%調整 --*/
      @media screen and (min-width:960px) {
        .animate__wrap .animate__obj--01 {
          top: 99px;
          left: calc(50% - 408px);
          width: auto;
        }
      }
  
      /* --- 動畫小物件 end --- */


      /* --- 背景動畫調整 --- */
      .sp__wallper .bg__container .first-layer {
        background: url(bg-animate-1.png) center 0;
        /* 1會在主視覺的上層 */
        z-index: 1; 
      }

      .sp__wallper .bg__container .second-layer {
        background: url(bg-animate-2.png) center 0;
        /* 1會在主視覺的上層 */
        /* z-index: 1;  */
      }

      .sp__wallper .bg__container .third-layer {
        background: url(bg-animate-3.png) center 0;
        /* 1會在主視覺的上層 */
        /* z-index: 1;  */
      }

      /* --- 背景動畫調整 end --- */

      /* --- 滑動Banner start --- */
      .banner__slider {
        /* 輪播的父層 */
        position: relative;
        z-index: 0
      }

      .banner__slider .swipersty__banner {
        /* position: absolute; */
        z-index: 0;
        top: 0%;
        left: calc(50% - 480px);
        width: 100%;
      }
     
      /* --- 滑動Banner end --- */


    </style>
